name: Morado
description: >-
  Morado is a Colombian fintech and B2B marketplace for the beauty and wellness
  industry across Latin America, founded in 2022 by Angela Maria Acosta (an early
  Rappi employee). It is the "everything store for beauty shops" — giving salons,
  spas, and independent beauty entrepreneurs (a workforce that is majority women)
  access to intelligent credit, working-capital lines, inventory supply, inventory
  management, last-mile logistics, and digital tools through a 100% digital process,
  even for businesses without a traditional financial history. Credit applications
  run over WhatsApp with 30/60/90-day revolving lines and 3-12 month term products,
  serving 32,000+ micro-business clients. Backed by QED Investors, Andreessen
  Horowitz, Tiger Global, H20 Capital, Latitud, and Village Global. Public surface
  is the moradocolombia.com marketing/credit site (built on Wix) — no first-party
  developer API, though the Wix site exposes a hosted MCP endpoint and an llms.txt.
